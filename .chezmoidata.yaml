# bd and dolt are pinned here rather than per-platform so macOS and WSL2 cannot
# hold different versions. A machine on an older bd minor targets a lower Dolt
# schema and cannot read a migrated remote; see docs/beads.md "Schema
# migrations". macOS reads these via private_dot_config/mise/conf.d, WSL2 via
# ansible extra vars from run_onchange_before_00-wsl-provision.sh.tmpl.
beads_version: "1.1.2" # renovate: datasource=github-releases depName=gastownhall/beads extractVersion=^v(?<version>.*)$
ccr_port: 3456
codebase_memory_mcp_version: "0.10.2" # renovate: datasource=github-releases depName=DeusData/codebase-memory-mcp extractVersion=^v(?<version>.*)$
dolt_version: "2.2.4" # renovate: datasource=github-releases depName=dolthub/dolt extractVersion=^v(?<version>.*)$
lazygit_version: "0.64.1" # renovate: datasource=github-releases depName=jesseduffield/lazygit extractVersion=^v(?<version>.*)$
# Native Windows runs Beads as a client of the WSL2 Dolt server (dots-to5).
# wsl_repo_rel is relative to the WSL2 $HOME, which is resolved at runtime so
# no Linux username is baked into this public repo. A Windows host without this
# distro or checkout resolves nothing and keeps its previous behavior.
beads_client:
  wsl_distro: Debian
  wsl_repo_rel: Documents/development/dotfiles
browser_policies:
  justthebrowser:
    enabled: true
    macos_open_profiles_on_update: true
macos_vdi:
  enabled: false
  install: false
  allow_downgrade: false
  citrix:
    desired_family: "26.03.11"
    display_version: "26.03.11"
    default_dmg_path: /Users/balaji/Downloads/Utilities/CitrixWorkspaceApp.dmg
  zoom:
    desired_pkg_version: "6.4.17.26900"
plannotator_port: 8999
plannotator_ports:
  host:
    build: "8993-8998"
    claude: "9014-9019"
    custom: "9004-9009"
  devcontainer:
    build: "9993-9998"
    claude: "10014-10019"
    custom: "10004-10009"
plannotator_version: "0.27.4" # renovate: datasource=github-releases depName=backnotprop/plannotator extractVersion=^v(?<version>.*)$
