gui:
  showRandomTip: false
  nerdFontsVersion: '3'
  showFileTree: true
git:
  parseEmoji: true
  truncateCopiedCommitHashesTo: 8
  ignoreWhitespaceInDiffView: true
  diffRenderers:
    - command: diff-so-fancy
os:
  editPreset: 'vscode'
  #editCommand: 'code -rg {{filename}}'
  #editCommandTemplate: '{{editor}} --goto -- {{filename}}:{{line}}'
promptToReturnFromSubprocess: false
# If true, don't display introductory popups upon opening Lazygit.
disableStartupPopups: true
customCommands:
  - key: '<c-n>'
    description: 'Show next Git tag version'
    context: 'global'
    command: 'git mkver next'
    output: terminal
  - key: '<c-g>'
    description: 'Tag next version'
    context: 'global'
    command: 'git mkver tag'
    output: terminal
  - key: '<c-a>'
    description: 'Arm GPT co-author for next commit'
    context: 'global'
    command: 'git config --global coauthor.gptNext true'
    output: terminal
  - key: '<c-d>'
    description: 'Disarm GPT co-author'
    context: 'global'
    command: 'git config --global --unset-all coauthor.gptNext'
    output: terminal
  - key: '<c-y>'
    description: 'Set default GPT co-author trailer'
    context: 'global'
    command: 'git config --global coauthor.gptTrailer "Co-authored-by: GPT-5.4 (High Reasoning mode) <noreply@openai.com>"'
    output: terminal
  - key: '<f9>'
    description: 'Amend author to OpenCode (ocauth)'
    context: 'global'
    command: 'git ocauth'
    output: terminal
