{{- /* chezmoi:modify-template */ -}}
{{- /*
     Ownership split for ~/.config/agent-of-empires/config.toml:

       aoe owns     - the file on disk and every key added by a future release.
       chezmoi owns - only the keys in the overlay below, which are merged over
                      the live file.

     Since aoe 1.13.2, application state lives in the sibling state.toml. AoE
     owns that file entirely; it is not an input to this modify-template.

     Do NOT re-add the full `aoe` config dump here. It used to be one, and
     pinning ~90 keys at whatever the defaults happened to be meant every
     upstream default change was silently suppressed and removed keys lingered
     forever (`worktree.show_branch_in_tui` was already dead by 1.12.1).

     A key belongs in this overlay only if:
       1. its value differs from aoe's schema default, or
       2. we want to pin it back to the default against a user value that aoe
          has persisted (see default_attach_mode below), or
       3. it is deliberate insurance against a default flip (telemetry).

     Check a key's schema default with:  aoe settings explain <section>.<field>
     After an aoe upgrade, re-run the dead-key check in
     docs/agents/aoe-notifications.md - a renamed key would be silently
     re-injected under its old name.
*/ -}}
{{- $input := .chezmoi.stdin | default "" -}}
{{- $live := dict -}}
{{- if gt (len (trim $input)) 0 -}}
{{-   $live = ($input | fromToml) | default dict -}}
{{- end -}}
{{- /* Prune retired settings from live inputs, including generated targets that AoE never opens. */ -}}
{{- if hasKey $live "session" -}}
{{-   $session := get $live "session" -}}
{{-   if and (kindIs "map" $session) (hasKey $session "conversation_summary_agent") -}}
{{-     $oldValue := get $session "conversation_summary_agent" -}}
{{-     $carriesMeaning := true -}}
{{-     if and (kindIs "string" $oldValue) (eq $oldValue "") -}}
{{-       $carriesMeaning = false -}}
{{-     end -}}
{{-     if and (not (hasKey $session "smart_rename_agent")) $carriesMeaning -}}
{{-       $_ := set $session "smart_rename_agent" $oldValue -}}
{{-     end -}}
{{-     $_ := unset $session "conversation_summary_agent" -}}
{{-   end -}}
{{- end -}}
{{- $retired := dict
      "session" (list "new_session_attach_mode" "smart_rename_timing" "session_id_poller_max_threads")
      "updates" (list "check_interval_hours" "notify_in_cli" "web_poll_interval_minutes")
      "acp" (list "replay_bytes" "max_concurrent_resumes" "force_end_turn_threshold_secs" "silent_orphan_fast_grace_secs" "rate_limit_auto_resume_grace_secs" "queue_drain_mode")
      "status_hooks" (list "debounce_ms")
      "sound" (list "mode")
      "worktree" (list "show_branch_in_tui")
-}}
{{- range $sectionName, $keys := $retired -}}
{{-   if hasKey $live $sectionName -}}
{{-     $section := get $live $sectionName -}}
{{-     if kindIs "map" $section -}}
{{-       range $key := $keys -}}
{{-         $_ := unset $section $key -}}
{{-       end -}}
{{-     end -}}
{{-   end -}}
{{- end -}}
{{- $repo := `
[acp]
auto_stop_idle_secs = 0
max_concurrent_workers = 5

[session]
confirm_before_quit = false
# Pinned. Equals the schema default, but aoe 1.12.1 persisted "live_send" as a
# user value, which made Enter open live mode instead of a full tmux attach.
default_attach_mode = "tmux"
default_tool = "opencode"
delete_to_trash = false
host_tab_title = true
row_tag = "none"

[session.agent_command_override]
claude = "claude-plannotator"
opencode = "opencode-plannotator"

[session.agent_detect_as]
opencode-custom = "opencode"

[session.custom_agents]
opencode-custom = "opencode-plannotator-custom"

[status_hooks]
enabled = true
on_error = "$HOME/bin/aoe-notify error"
on_waiting = "$HOME/bin/aoe-notify waiting"

# Equals the schema default; pinned so an upstream flip cannot opt us in.
[telemetry]
enabled = false

# Both default to "auto", which opts out the moment a ~/.config/tmux/tmux.conf
# exists - and aoe reads that path, since it starts tmux without -f. Pinned so a
# future tmux config cannot silently cost us OSC52 forwarding or the themed
# status bar; see docs/tooling/iterm-titles.md. clipboard also permits wrapped
# programs to pass escape sequences through tmux.
[tmux]
clipboard = "enabled"
status_bar = "enabled"

[updates]
update_check_mode = "off"

[worktree]
delete_branch_on_cleanup = true
enabled = true
path_template = "./worktrees/{branch}-{session-id}"
` | fromToml -}}
{{- mergeOverwrite $live $repo | toToml -}}
