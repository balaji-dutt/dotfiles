  # To enter details of payments made through banking/payment websites.
  - trigger: ":paidcc"
    replace: "{{payment_text}}"
    vars:
      - name: formfields
        type: form
        params:
          layout: |
            Select Bank Portal: [[bank]]
          fields:
            bank:
              type: choice
              values:
                - StanChart Internet Banking
                - OCBC Internet Banking
                - CardUp Portal
      - name: payment_text
        type: script
        params:
          args:
            - "{{payment_python}}"
            - "%CONFIG%/scripts/payment-from-copyq.py"
            - --variant
            - paidcc
            - --bank-portal
            - "{{formfields.bank}}"

  # Variant with Salary and Spare pools (Diff. Eye included)
  - trigger: ":dpaidcc"
    replace: "{{payment_text}}"
    vars:
      - name: formfields
        type: form
        params:
          layout: |
            Select Bank Portal: [[bank]]
          fields:
            bank:
              type: choice
              values:
                - StanChart Internet Banking
                - OCBC Internet Banking
                - CardUp Portal
      - name: payment_text
        type: script
        params:
          args:
            - "{{payment_python}}"
            - "%CONFIG%/scripts/payment-from-copyq.py"
            - --variant
            - dpaidcc
            - --bank-portal
            - "{{formfields.bank}}"

  # Variant with Salary and Spare pools
  - trigger: ":spaidcc"
    replace: "{{payment_text}}"
