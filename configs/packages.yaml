# =============================================================================
# WSL2 Package Configuration
# =============================================================================
# Single source of truth for all packages installed via Ansible.
# Update this file and run `chezmoi apply` to sync.
# =============================================================================

# -----------------------------------------------------------------------------
# Tool versions (GitHub releases)
# -----------------------------------------------------------------------------
versions:
  aoe: "1.7.0" # renovate: datasource=github-releases depName=njbrake/agent-of-empires extractVersion=^v(?<version>.*)$
  dolt: "2.0.2" # renovate: datasource=github-releases depName=dolthub/dolt extractVersion=^v(?<version>.*)$
  lazygit: "0.61.1" # renovate: datasource=github-releases depName=jesseduffield/lazygit extractVersion=^v(?<version>.*)$
  lazydocker: "0.25.2" # renovate: datasource=github-releases depName=jesseduffield/lazydocker extractVersion=^v(?<version>.*)$
  mnemo: "1.3.7" # renovate: datasource=github-releases depName=Pilan-AI/mnemo extractVersion=^v(?<version>.*)$
  snip: "0.15.0" # renovate: datasource=github-releases depName=edouard-claude/snip extractVersion=^v(?<version>.*)$
  openusage: "0.9.6" # renovate: datasource=github-releases depName=janekbaraniewski/openusage extractVersion=^v(?<version>.*)$

# -----------------------------------------------------------------------------
# Apt packages - All WSL instances
# -----------------------------------------------------------------------------
base_apt_packages:
  - locales
  - build-essential
  - curl
  - wget
  - unzip
  - fd-find
  - ripgrep
  - fzf
  - direnv
  - jq
  - tmux
  - zsh
  - nfs-common
  - keychain
  - socat
  - git
  - ca-certificates
  - gnupg
  - apt-transport-https
  - gettext
  - libgl1

# -----------------------------------------------------------------------------
# Apt packages - Ubuntu only
# -----------------------------------------------------------------------------
ubuntu_apt_packages:
  - gedit
  - nautilus
  - p7zip-full
  - p7zip-rar
  - wslu
  - xdg-utils

# -----------------------------------------------------------------------------
# Python CLI tools
# -----------------------------------------------------------------------------
# Installed via `uv tool` (NOT pipx).
# Source of truth is `configs/uv_tools.txt`.
