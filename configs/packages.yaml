# yaml-language-server: $schema=./schemas/packages.v1.schema.json
# =============================================================================
# WSL2 Package Configuration
# =============================================================================
# Single source of truth for all packages installed via Ansible.
# Update this file and run `chezmoi apply` to sync.
# =============================================================================

# -----------------------------------------------------------------------------
# Tool versions (release archives)
# -----------------------------------------------------------------------------
versions:
  aoe: "1.15.1" # renovate: datasource=github-releases depName=agent-of-empires/agent-of-empires extractVersion=^v(?<version>.*)$
  # dolt moved to .chezmoidata.yaml (dolt_version) so macOS and WSL2 share one
  # pin; wsl-playbook.yml receives it via -e.
  gh: "2.98.0" # renovate: datasource=github-releases depName=cli/cli extractVersion=^v(?<version>.*)$
  glab: "1.115.0" # renovate: datasource=gitlab-releases depName=gitlab-org/cli extractVersion=^v(?<version>.*)$
  lazydocker: "0.25.2" # renovate: datasource=github-releases depName=jesseduffield/lazydocker extractVersion=^v(?<version>.*)$
  openusage: "0.24.4" # renovate: datasource=github-releases depName=janekbaraniewski/openusage extractVersion=^v(?<version>.*)$

# -----------------------------------------------------------------------------
# Apt packages - All WSL instances
# -----------------------------------------------------------------------------
base_apt_packages:
  - locales
  - build-essential
  - curl
  - wget
  - unzip
  - fd-find
  - ripgrep
  - fzf
  - direnv
  - jq
  - tmux
  - zsh
  - nfs-common
  - keychain
  - socat
  - git
  - ca-certificates
  - gnupg
  - apt-transport-https
  - gettext
  - libgl1

# -----------------------------------------------------------------------------
# Apt packages - Ubuntu only
# -----------------------------------------------------------------------------
ubuntu_apt_packages:
  - gedit
  - nautilus
  - p7zip-full
  - p7zip-rar
  - wslu
  - xdg-utils

# -----------------------------------------------------------------------------
# Python CLI tools
# -----------------------------------------------------------------------------
# Installed via `uv tool` (NOT pipx).
# Source of truth is `configs/uv_tools.txt`.
