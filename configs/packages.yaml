# =============================================================================
# WSL2 Package Configuration
# =============================================================================
# Single source of truth for all packages installed via Ansible.
# Update this file and run `chezmoi apply` to sync.
# =============================================================================

# -----------------------------------------------------------------------------
# Tool versions (GitHub releases)
# -----------------------------------------------------------------------------
versions:
  lazygit: "0.44.1"
  lazydocker: "0.23.3"
  git_mkver: "1.3.0"
  change: "1.1.0"
  eza: "0.20.10"
  mise: "2024.11.8"

# -----------------------------------------------------------------------------
# Apt packages - All WSL instances
# -----------------------------------------------------------------------------
base_apt_packages:
  - build-essential
  - curl
  - wget
  - unzip
  - fd-find
  - ripgrep
  - fzf
  - direnv
  - jq
  - tmux
  - zsh
  - nfs-common
  - keychain
  - socat
  - git
  - ca-certificates
  - gnupg
  - apt-transport-https

# -----------------------------------------------------------------------------
# Apt packages - Ubuntu only
# -----------------------------------------------------------------------------
ubuntu_apt_packages:
  - gedit
  - nautilus
  - p7zip-full
  - p7zip-rar
  - wslu
  - aspell
  - aspell-en
  - hunspell
  - hunspell-en-us

# -----------------------------------------------------------------------------
# Pipx packages - Ubuntu only
# -----------------------------------------------------------------------------
ubuntu_pipx_packages:
  - FanFicFare
