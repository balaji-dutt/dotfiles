[settings]
# Ansible installs the configured WSL2 tools. Disabling command-not-found
# auto-install lets full activation drop shims; explicit shim callers also fail
# instead of falling through when a configured tool is missing.
not_found_auto_install = false
not_found_system_fallback = false

[tools]
opencode = "1.18.31"
claude = "latest"
"npm:@devcontainers/cli" = "latest"
# bd moved to .chezmoidata.yaml (beads_version) so macOS and WSL2 share one pin.
# ansible/wsl-playbook.yml writes it to ~/.config/mise/conf.d/95-beads.toml.
