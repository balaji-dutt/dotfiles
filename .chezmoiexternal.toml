# Doom Emacs (Ubuntu WSL only)
{{-   if eq .chezmoi.osRelease.id "ubuntu" }}
[".config/emacs"]
    type = "git-repo"
    url = "https://github.com/doomemacs/doomemacs"
    refreshPeriod = "168h"
    [".config/emacs".pull]
        args = ["--rebase", "--autostash"]
{{-   end }}
{{ end -}}
