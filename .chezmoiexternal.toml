{{- if eq .chezmoi.os "darwin" -}}
[".zprezto"]
    type = "git-repo"
    url = "https://github.com/sorin-ionescu/prezto"
    refreshPeriod = "168h"
    [".zprezto".clone]
        args = ["--recursive"]
["Applications/change"]
    type = "file"
    executable = true
    url = "https://raw.githubusercontent.com/adamtabrams/change/master/change"
    refreshPeriod = "168h"
["Applications/terraform.py"]
    type = "file"
    executable = true
    url = "https://raw.githubusercontent.com/nbering/terraform-inventory/master/terraform.py"
    refreshPeriod = "168h"
{{ end -}}
{{- if and (eq .chezmoi.os "linux") (.chezmoi.kernel.osrelease | lower | contains "microsoft") -}}
{{- $lazygitver := output "lastversion" "--assets" "jesseduffield/lazygit" | trim -}}
[".local/bin/change"]
    type = "file"
    executable = true
    url = "https://raw.githubusercontent.com/adamtabrams/change/master/change"
    refreshPeriod = "168h"
[".local/bin/lazygit"]
    type = "file"
    url = {{ printf "%s" $lazygitver | quote }}
    executable = true
    refreshPeriod = "168h"
    [".local/bin/lazygit".filter]
        command = "tar"
        args = ["--extract", "--file", "/dev/stdin", "--gzip", "--to-stdout", "lazygit"]
[".local/bin/terraform.py"]
    type = "file"
    executable = true
    url = "https://raw.githubusercontent.com/nbering/terraform-inventory/master/terraform.py"
    refreshPeriod = "168h"
{{ end -}}