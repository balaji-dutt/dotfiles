# Pipelines for this repo focus on keeping vendored upstream artifacts in
# sync with their pinned versions. New jobs should follow the same
# branch-based dispatch pattern used by `statusline-sync`.

stages:
  - sync

statusline-sync:
  stage: sync
  image: alpine:3.20
  timeout: 10m
  before_script:
    - apk add --no-cache bash curl git
  script:
    # alpine's default shell is ash; bashisms (e.g. `[[ =~ ]]`) need explicit
    # bash. Quoted heredoc delimiter prevents the outer shell from expanding
    # variables — bash receives them literally and resolves them itself.
    - |
      bash <<'JOBSCRIPT'
      set -euo pipefail
      if [[ "${CI_COMMIT_REF_NAME}" =~ ^renovate/statusline- ]]; then
        echo "==> statusline sync branch detected: ${CI_COMMIT_REF_NAME}"
        bash assets/sync-statusline.sh
        if git diff --quiet -- dot_claude/executable_statusline.sh \
             private_Documents/development/container-dotfiles/dotfiles/dot_claude/executable_statusline.sh; then
          echo "==> vendored body already matches the pinned version; nothing to push"
          exit 0
        fi
        if [ -z "${VENDOREDFILE_SYNC_TOKEN:-}" ]; then
          echo "ERROR: VENDOREDFILE_SYNC_TOKEN CI variable is not set;" >&2
          echo "       see docs/automation/renovate-gitlab-runner-setup.md" >&2
          exit 1
        fi
        export GIT_AUTHOR_NAME="Renovate Bot"
        export GIT_AUTHOR_EMAIL="service_account_group_65498163_3cf840e6e3ac6e34bec3beb607caff8a@noreply.gitlab.com"
        export GIT_COMMITTER_NAME="Renovate Bot"
        export GIT_COMMITTER_EMAIL="service_account_group_65498163_3cf840e6e3ac6e34bec3beb607caff8a@noreply.gitlab.com"
        git add \
          dot_claude/executable_statusline.sh \
          private_Documents/development/container-dotfiles/dotfiles/dot_claude/executable_statusline.sh
        git commit --amend --no-edit
        git remote set-url origin "https://oauth2:${VENDOREDFILE_SYNC_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
        git push \
          --force-with-lease="refs/heads/${CI_COMMIT_REF_NAME}:${CI_COMMIT_SHA}" \
          origin "HEAD:${CI_COMMIT_REF_NAME}"
        echo "==> amended commit pushed; superseding pipeline will validate"
      else
        echo "==> non-statusline branch; validating vendored body against pinned version"
        bash assets/sync-statusline.sh --check
      fi
      JOBSCRIPT
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'

beads-kanban-pin-sync:
  stage: sync
  image: alpine:3.20
  timeout: 10m
  before_script:
    - apk add --no-cache bash curl git
  script:
    # Renovate bumps only the version sentinel in the three install sites; it
    # cannot compute the release checksum. Refresh EXPECTED_SHA here, before
    # platformAutomerge can fire.
    - |
      bash <<'JOBSCRIPT'
      set -euo pipefail
      BK_FILES=(
        .chezmoiscripts/run_onchange_after_install_better_beads_kanban.sh.tmpl
        .chezmoiscripts/run_onchange_after_install_better_beads_kanban.ps1.tmpl
        private_Documents/development/container-dotfiles/devcontainers/gitlab.com/servers-homelab/homelab-IaC/dot_devcontainer/devcontainer-common.sh
      )
      if [[ "${CI_COMMIT_REF_NAME}" =~ ^renovate/beads-kanban- ]]; then
        echo "==> beads kanban pin branch detected: ${CI_COMMIT_REF_NAME}"
        bash assets/sync-beads-kanban-pin.sh --write
        if git diff --quiet -- "${BK_FILES[@]}"; then
          echo "==> pinned checksum already matches the release; nothing to push"
          exit 0
        fi
        if [ -z "${VENDOREDFILE_SYNC_TOKEN:-}" ]; then
          echo "ERROR: VENDOREDFILE_SYNC_TOKEN CI variable is not set;" >&2
          echo "       see docs/automation/renovate-gitlab-runner-setup.md" >&2
          exit 1
        fi
        export GIT_AUTHOR_NAME="Renovate Bot"
        export GIT_AUTHOR_EMAIL="service_account_group_65498163_3cf840e6e3ac6e34bec3beb607caff8a@noreply.gitlab.com"
        export GIT_COMMITTER_NAME="Renovate Bot"
        export GIT_COMMITTER_EMAIL="service_account_group_65498163_3cf840e6e3ac6e34bec3beb607caff8a@noreply.gitlab.com"
        git add "${BK_FILES[@]}"
        git commit --amend --no-edit
        git remote set-url origin "https://oauth2:${VENDOREDFILE_SYNC_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
        git push \
          --force-with-lease="refs/heads/${CI_COMMIT_REF_NAME}:${CI_COMMIT_SHA}" \
          origin "HEAD:${CI_COMMIT_REF_NAME}"
        echo "==> amended commit pushed; superseding pipeline will validate"
      else
        echo "==> non-beads-kanban branch; validating pinned checksum against the release"
        bash assets/sync-beads-kanban-pin.sh --check
      fi
      JOBSCRIPT
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'

browser-policy-sync:
  stage: sync
  image: alpine:3.20
  timeout: 10m
  before_script:
    - apk add --no-cache git python3
  script:
    - |
      set -eu
      case "${CI_COMMIT_REF_NAME}" in
        renovate/browser-policies-*)
          echo "==> browser policy sync branch detected: ${CI_COMMIT_REF_NAME}"
          python3 assets/sync-browser-policies.py --write
          if git diff --quiet -- configs/browser-policies/justthebrowser; then
            echo "==> vendored browser policies already match the pinned version; nothing to push"
            exit 0
          fi
          if [ -z "${VENDOREDFILE_SYNC_TOKEN:-}" ]; then
            echo "ERROR: VENDOREDFILE_SYNC_TOKEN CI variable is not set;" >&2
            echo "       see docs/automation/renovate-gitlab-runner-setup.md" >&2
            exit 1
          fi
          export GIT_AUTHOR_NAME="Renovate Bot"
          export GIT_AUTHOR_EMAIL="service_account_group_65498163_3cf840e6e3ac6e34bec3beb607caff8a@noreply.gitlab.com"
          export GIT_COMMITTER_NAME="Renovate Bot"
          export GIT_COMMITTER_EMAIL="service_account_group_65498163_3cf840e6e3ac6e34bec3beb607caff8a@noreply.gitlab.com"
          git add configs/browser-policies/justthebrowser
          git commit --amend --no-edit
          git remote set-url origin "https://oauth2:${VENDOREDFILE_SYNC_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
          git push \
            --force-with-lease="refs/heads/${CI_COMMIT_REF_NAME}:${CI_COMMIT_SHA}" \
            origin "HEAD:${CI_COMMIT_REF_NAME}"
          echo "==> amended commit pushed; superseding pipeline will validate"
          ;;
        *)
          echo "==> non-browser-policy branch; validating vendored policies against pinned version"
          python3 assets/sync-browser-policies.py --check
          ;;
      esac
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
