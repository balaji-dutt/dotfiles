name: platform-fast

on:
  push:
    branches-ignore:
      - 'renovate/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-fast-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fast:
    name: fast (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Keep checkout bytes identical across platforms
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Expose sh from Git for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command sh -ErrorAction SilentlyContinue)) {
            Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'
          }
      - name: Run the fast suite
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p ci-artifacts
          ./assets/run-tests.sh fast --require-capabilities --report-file "ci-artifacts/fast-${{ matrix.os }}.json"
      - name: Run the fast suite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null
          pwsh -NoProfile -File ./assets/run-tests.ps1 fast --require-capabilities --report-file "ci-artifacts/fast-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fast-${{ matrix.os }}
          path: ci-artifacts/fast-${{ matrix.os }}.json
          retention-days: 7
