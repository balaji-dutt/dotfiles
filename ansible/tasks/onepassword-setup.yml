---
# =============================================================================
# 1Password CLI Setup
# =============================================================================

- name: Check if 1Password account is already added
  ansible.builtin.command:
    cmd: op account list
  register: op_accounts
  changed_when: false
  failed_when: false

- name: Manual 1Password Authentication Required
  # Check if the URL is present in the output of 'op account list'
  when: op_url not in op_accounts.stdout
  block:
    - name: Pause for manual authentication
      ansible.builtin.pause:
        prompt: |
          =================================================================
          1PASSWORD SETUP REQUIRED
          =================================================================
          The 1Password CLI needs to be authenticated interactively.
          Ansible cannot handle the browser launch/interaction directly.

          Please run this command in your terminal (or a new tab):

              op account add --address {{ op_url }} --email {{ op_email }}

          Complete the browser authentication flow.

          Press [Enter] here once you have successfully added the account.
          =================================================================

    - name: Verify 1Password account was added
      ansible.builtin.command:
        cmd: op account list
      register: op_verify
      changed_when: false

    - name: Fail if account is still missing
      ansible.builtin.fail:
        msg: "1Password account was not detected. Please try running 'op account add' manually."
      when: op_url not in op_verify.stdout
