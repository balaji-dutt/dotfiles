---
# =============================================================================
# Third-party APT repositories
# =============================================================================

- name: Ensure apt keyrings directory exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add eza GPG key
  become: true
  ansible.builtin.shell: |
    wget -qO- https://raw.githubusercontent.com/eza-community/eza/main/deb.asc | gpg --dearmor -o /etc/apt/keyrings/gierens.gpg
  args:
    creates: /etc/apt/keyrings/gierens.gpg

- name: Set eza GPG key permissions
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings/gierens.gpg
    mode: "0644"

- name: Add eza repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/gierens.gpg] http://deb.gierens.de stable main"
    filename: gierens
    state: present

- name: Add mise GPG key
  become: true
  ansible.builtin.shell: |
    curl -fsSL https://mise.jdx.dev/gpg-key.pub | tee /etc/apt/keyrings/mise-archive-keyring.asc > /dev/null
  args:
    creates: /etc/apt/keyrings/mise-archive-keyring.asc

- name: Set mise GPG key permissions
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings/mise-archive-keyring.asc
    mode: "0644"

- name: Add mise repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/mise-archive-keyring.asc arch=amd64] https://mise.jdx.dev/deb stable main"
    filename: mise
    state: present

- name: Add 1Password GPG key
  become: true
  ansible.builtin.get_url:
    url: https://downloads.1password.com/linux/keys/1password.asc
    dest: /etc/apt/keyrings/1password-archive-keyring.asc
    mode: "0644"

- name: Dearmor 1Password GPG key
  become: true
  ansible.builtin.shell: |
    gpg --dearmor < /etc/apt/keyrings/1password-archive-keyring.asc > /etc/apt/keyrings/1password-archive-keyring.gpg
  args:
    creates: /etc/apt/keyrings/1password-archive-keyring.gpg

- name: Add 1Password repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ deb_arch }} signed-by=/etc/apt/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/{{ deb_arch }} stable main"
    filename: 1password
    state: present

# -----------------------------------------------------------------------------
# Sublime Text / Sublime Merge (Debian only)
# -----------------------------------------------------------------------------
- name: Add Sublime GPG key
  become: true
  ansible.builtin.shell: |
    wget -qO- https://download.sublimetext.com/sublimehq-pub.gpg | gpg --dearmor -o /etc/apt/keyrings/sublimehq-archive.gpg
  args:
    creates: /etc/apt/keyrings/sublimehq-archive.gpg
  when: is_debian | bool

- name: Set Sublime GPG key permissions
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings/sublimehq-archive.gpg
    mode: "0644"
  when: is_debian | bool

- name: Add Sublime repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/sublimehq-archive.gpg] https://download.sublimetext.com/ apt/stable/"
    filename: sublime-text
    state: present
  when: is_debian | bool

# -----------------------------------------------------------------------------
# Docker (Debian only)
# -----------------------------------------------------------------------------
- name: Add Docker GPG key
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ distro_id }}/gpg
    dest: /etc/apt/keyrings/docker-archive-keyring.asc
    mode: "0644"
  when: is_debian | bool

- name: Dearmor Docker GPG key
  become: true
  ansible.builtin.shell: |
    gpg --dearmor < /etc/apt/keyrings/docker-archive-keyring.asc > /etc/apt/keyrings/docker-archive-keyring.gpg
  args:
    creates: /etc/apt/keyrings/docker-archive-keyring.gpg
  when: is_debian | bool

- name: Add Docker repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ deb_arch }} signed-by=/etc/apt/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/{{ distro_id }} {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
  when: is_debian | bool

- name: Update apt cache after adding repos
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Install common packages from third-party repos
  become: true
  ansible.builtin.apt:
    name:
      - eza
      - mise
      - 1password-cli
    state: present

- name: Install Debian-specific packages from third-party repos
  become: true
  ansible.builtin.apt:
    name:
      - sublime-text
      - sublime-merge
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  when: is_debian | bool

# -----------------------------------------------------------------------------
# Docker post-install
# -----------------------------------------------------------------------------
- name: Add user to docker group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_env.USER }}"
    groups: docker
    append: true
  when: is_debian | bool
