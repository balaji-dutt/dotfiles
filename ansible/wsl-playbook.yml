---
- name: Provision WSL2 Environment
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

    # Distro detection - passed from chezmoi
    distro_id: "{{ distro_id | default(ansible_distribution | lower) }}"
    distro_version: "{{ distro_version | default(ansible_distribution_version) }}"

    # Conditional flags
    is_ubuntu: "{{ distro_id == 'ubuntu' }}"
    is_debian: "{{ distro_id == 'debian' }}"

    # Paths
    local_bin: "{{ ansible_env.HOME }}/.local/bin"
    local_share: "{{ ansible_env.HOME }}/.local/share"
    packages_file: "{{ chezmoi_source_dir }}/configs/packages.yaml"

    # Homelab config - passed from chezmoi, with safe defaults
    nfs_server: "{{ nfs_server | default('') }}"
    nfs_path: "{{ nfs_path | default('') }}"
    windows_user: "{{ windows_user | default('') }}"
    cert_path: "{{ cert_path | default('') }}"
    cert_files: "{{ cert_files | default('') }}"

    # 1Password config
    op_url: "{{ op_url | default('') }}"
    op_email: "{{ op_email | default('') }}"

    # Architecture mapping
    arch_map:
      x86_64: amd64
      aarch64: arm64
    deb_arch: "{{ arch_map[ansible_architecture] | default('amd64') }}"

  pre_tasks:
    - name: Load packages configuration
      ansible.builtin.include_vars:
        file: "{{ packages_file }}"

    - name: Display detected configuration
      ansible.builtin.debug:
        msg:
          - "Distro: {{ distro_id }} {{ distro_version }}"
          - "Is Ubuntu: {{ is_ubuntu }}"
          - "Is Debian: {{ is_debian }}"
          - "Architecture: {{ ansible_architecture }} ({{ deb_arch }})"
          - "Packages file: {{ packages_file }}"

    - name: Ensure local bin directory exists
      ansible.builtin.file:
        path: "{{ local_bin }}"
        state: directory
        mode: "0755"

    - name: Ensure local share directory exists
      ansible.builtin.file:
        path: "{{ local_share }}"
        state: directory
        mode: "0755"

  tasks:
    - name: Include base packages
      ansible.builtin.include_tasks: tasks/base-packages.yml

    - name: Include apt repositories
      ansible.builtin.include_tasks: tasks/apt-repos.yml

    - name: Ensure mise config directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/mise"
        state: directory
        mode: "0755"

    - name: Symlink mise global config to dotfiles
      ansible.builtin.file:
        src: "{{ chezmoi_source_dir }}/configs/mise.toml"
        dest: "{{ ansible_env.HOME }}/.config/mise/config.toml"
        state: link
        force: true

    - name: Install mise tools from global config
      ansible.builtin.command: mise install -y

    - name: Read uv tools manifest
      ansible.builtin.slurp:
        src: "{{ chezmoi_source_dir }}/configs/uv_tools.txt"
      register: uv_tools_manifest

    - name: Parse uv tools manifest
      ansible.builtin.set_fact:
        uv_tools_desired: >-
          {{
            (uv_tools_manifest.content | b64decode).splitlines()
            | reject('match', '^\\s*(#|$)')
            | list
          }}

    - name: List installed uv tools
      ansible.builtin.shell: |
        set -euo pipefail
        mise exec -- uv tool list | grep -v '^-'
      args:
        executable: /bin/bash
      register: uv_tools_installed_raw
      changed_when: false
      failed_when: uv_tools_installed_raw.rc not in [0, 1]

    - name: Parse installed uv tools
      ansible.builtin.set_fact:
        uv_tools_installed: >-
          {{
            uv_tools_installed_raw.stdout_lines
            | map('regex_replace', '\\s+.*$', '')
            | reject('equalto', '')
            | list
          }}

    - name: Install uv tools
      ansible.builtin.command: mise exec -- uv tool install {{ item }} --force
      loop: "{{ uv_tools_desired }}"
      when: item not in uv_tools_installed

    - name: Include ZSH and Antidote setup
      ansible.builtin.include_tasks: tasks/zsh-setup.yml

    - name: Include Emacs setup (Ubuntu only)
      ansible.builtin.include_tasks: tasks/emacs.yml
      when: is_ubuntu | bool

    - name: Include Debian dev tools
      ansible.builtin.include_tasks: tasks/debian-dev-tools.yml
      when: is_debian | bool

    - name: Include Ubuntu extras
      ansible.builtin.include_tasks: tasks/ubuntu-extras.yml
      when: is_ubuntu | bool

    - name: Include system configuration
      ansible.builtin.include_tasks: tasks/system-config.yml

    - name: Include certificates
      ansible.builtin.include_tasks: tasks/certificates.yml
      when:
        - cert_path | length > 0
        - cert_files | length > 0

    - name: Include 1Password setup
      ansible.builtin.include_tasks: tasks/onepassword-setup.yml
      when: op_url | length > 0

  post_tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "WSL2 provisioning complete!"
          - "Restart your terminal or run: exec zsh"
          - "NOTE: Run 'cz apply' again to finalize shell config (some .zshrc sections are generated based on which tools exist at apply time)."
          - "You may need to restart WSL for some changes to take effect."
