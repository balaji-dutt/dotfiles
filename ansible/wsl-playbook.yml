---
# WSL2 provisioning playbook (managed via chezmoi)
- name: Ensure required locales
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    LC_ALL: C
    LANG: C

  tasks:
    - name: Ensure locales package is installed
      become: true
      ansible.builtin.apt:
        name: locales
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: List available locales
      ansible.builtin.command: locale -a
      register: locale_a
      changed_when: false

    - name: Ensure en_GB.UTF-8 is enabled in /etc/locale.gen
      become: true
      ansible.builtin.lineinfile:
        path: /etc/locale.gen
        regexp: '^#?\s*en_GB\.UTF-8\s+UTF-8\s*$'
        line: 'en_GB.UTF-8 UTF-8'
      register: locale_gen_gb

    - name: Ensure en_SG.UTF-8 is enabled in /etc/locale.gen
      become: true
      ansible.builtin.lineinfile:
        path: /etc/locale.gen
        regexp: '^#?\s*en_SG\.UTF-8\s+UTF-8\s*$'
        line: 'en_SG.UTF-8 UTF-8'
      register: locale_gen_sg

    - name: Generate enabled locales
      become: true
      ansible.builtin.command: locale-gen
      when: >
        locale_gen_gb.changed or
        locale_gen_sg.changed or
        ('en_GB.utf8' not in locale_a.stdout_lines) or
        ('en_SG.utf8' not in locale_a.stdout_lines)

    - name: Set default locale environment
      become: true
      ansible.builtin.lineinfile:
        path: /etc/default/locale
        create: true
        mode: '0644'
        regexp: '^{{ item.key }}='
        line: '{{ item.key }}={{ item.value }}'
      loop:
        - { key: LANG, value: en_GB.UTF-8 }
        - { key: LANGUAGE, value: 'en_GB:en_US' }
        - { key: LC_MESSAGES, value: en_GB.UTF-8 }
        - { key: LC_TIME, value: en_SG.UTF-8 }
        - { key: LC_NUMERIC, value: en_SG.UTF-8 }
        - { key: LC_MONETARY, value: en_SG.UTF-8 }

- name: Provision WSL2 Environment
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

    # Distro detection - passed from chezmoi
    distro_id: "{{ distro_id | default(ansible_distribution | lower) }}"
    distro_version: "{{ distro_version | default(ansible_distribution_version) }}"

    # Conditional flags
    is_ubuntu: "{{ distro_id == 'ubuntu' }}"
    is_debian: "{{ distro_id == 'debian' }}"

    # Paths
    local_bin: "{{ ansible_env.HOME }}/.local/bin"
    local_share: "{{ ansible_env.HOME }}/.local/share"
    packages_file: "{{ chezmoi_source_dir }}/configs/packages.yaml"
    promptfoo_runtime_dir: "{{ local_share }}/promptfoo-runtime"

    # Homelab config - passed from chezmoi, with safe defaults
    nfs_server: "{{ nfs_server | default('') }}"
    nfs_path: "{{ nfs_path | default('') }}"
    windows_user: "{{ windows_user | default('') }}"
    cert_path: "{{ cert_path | default('') }}"
    cert_files: "{{ cert_files | default('') }}"

    # 1Password config
    op_url: "{{ op_url | default('') }}"
    op_email: "{{ op_email | default('') }}"

    # Architecture mapping
    arch_map:
      x86_64: amd64
      aarch64: arm64
    deb_arch: "{{ arch_map[ansible_architecture] | default('amd64') }}"

    # Plannotator publishes release assets as plannotator-linux-{x64,arm64}.
    # Map our deb_arch -> plannotator's asset arch label.
    plannotator_arch_map:
      amd64: x64
      arm64: arm64
    plannotator_arch: "{{ plannotator_arch_map[deb_arch] | default('x64') }}"

    # lazygit publishes release assets as lazygit_VERSION_Linux_{x86_64,arm64}.
    # Map our deb_arch -> lazygit's asset arch label.
    lazygit_arch_map:
      amd64: x86_64
      arm64: arm64
    lazygit_arch: "{{ lazygit_arch_map[deb_arch] | default('x86_64') }}"

    # Pinned by chezmoi (.chezmoidata.yaml) and passed via -e on the
    # ansible-playbook command line. Renovate keeps it current.
    lazygit_version: "{{ lazygit_version | default('') }}"

    # Pinned by chezmoi (.chezmoidata.yaml) and passed via -e on the
    # ansible-playbook command line. Renovate keeps it current.
    plannotator_version: "{{ plannotator_version | default('') }}"

    # Same mechanism, but these two exist to keep macOS and WSL2 on one value.
    # A machine on an older bd minor targets a lower Dolt schema and cannot read
    # a migrated remote; see docs/beads.md "Schema migrations".
    beads_version: "{{ beads_version | default('') }}"
    dolt_version: "{{ dolt_version | default('') }}"
    codebase_memory_mcp_version: "{{ codebase_memory_mcp_version | default('') }}"

  pre_tasks:
    - name: Load packages configuration
      ansible.builtin.include_vars:
        file: "{{ packages_file }}"

    - name: Display detected configuration
      ansible.builtin.debug:
        msg:
          - "Distro: {{ distro_id }} {{ distro_version }}"
          - "Is Ubuntu: {{ is_ubuntu }}"
          - "Is Debian: {{ is_debian }}"
          - "Architecture: {{ ansible_architecture }} ({{ deb_arch }})"
          - "Packages file: {{ packages_file }}"

    - name: Ensure local bin directory exists
      ansible.builtin.file:
        path: "{{ local_bin }}"
        state: directory
        mode: "0755"

    - name: Ensure local share directory exists
      ansible.builtin.file:
        path: "{{ local_share }}"
        state: directory
        mode: "0755"

  tasks:
    - name: Include base packages
      ansible.builtin.include_tasks: tasks/base-packages.yml

    - name: Include apt repositories
      ansible.builtin.include_tasks: tasks/apt-repos.yml

    - name: Ensure mise config directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/mise"
        state: directory
        mode: "0755"

    - name: Ensure mise conf.d directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/mise/conf.d"
        state: directory
        mode: "0755"

    - name: Symlink mise global config to dotfiles
      ansible.builtin.file:
        src: "{{ chezmoi_source_dir }}/configs/mise.toml"
        dest: "{{ ansible_env.HOME }}/.config/mise/config.toml"
        state: link
        force: true

    - name: Symlink mise WSL2 config fragment to dotfiles
      ansible.builtin.file:
        src: "{{ chezmoi_source_dir }}/configs/mise_wsl2.toml"
        dest: "{{ ansible_env.HOME }}/.config/mise/conf.d/90-wsl2.toml"
        state: link
        force: true

    # bd is pinned in .chezmoidata.yaml and passed in as beads_version so macOS
    # and WSL2 cannot drift; see docs/beads.md "Schema migrations". Written here
    # rather than by chezmoi because this playbook runs from a run_onchange_before
    # script, so a chezmoi-rendered fragment would land after the mise install
    # below and only take effect on the next apply. dolt is not installed via
    # mise here; it comes from the release tarball task further down.
    - name: Write mise Beads pin fragment
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.config/mise/conf.d/95-beads.toml"
        mode: "0644"
        content: |
          # Managed by ansible/wsl-playbook.yml. Pin lives in .chezmoidata.yaml.
          [tools]
          "github:gastownhall/beads" = "{{ beads_version }}"
      when: (beads_version | default('')) | length > 0

    # CBM no longer has a fallback in configs/mise.toml, so direct playbook
    # invocations must provide this shared pin just like the chezmoi hook does.
    - name: Validate codebase-memory-mcp pin
      ansible.builtin.assert:
        that:
          - (codebase_memory_mcp_version | default('')) | length > 0
        fail_msg: >-
          codebase_memory_mcp_version must be provided from .chezmoidata.yaml

    - name: Write mise codebase-memory-mcp pin fragment
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.config/mise/conf.d/96-codebase-memory-mcp.toml"
        mode: "0644"
        content: |
          # Managed by ansible/wsl-playbook.yml. Pin lives in .chezmoidata.yaml.
          [tools]
          "github:DeusData/codebase-memory-mcp" = "{{ codebase_memory_mcp_version }}"

    - name: Install mise tools from global config
      ansible.builtin.command: mise install -y

    - name: Ensure Promptfoo runtime directory exists
      ansible.builtin.file:
        path: "{{ promptfoo_runtime_dir }}"
        state: directory
        mode: "0755"

    - name: Copy Promptfoo runtime package manifest
      ansible.builtin.copy:
        src: "{{ chezmoi_source_dir }}/configs/promptfoo-runtime/package.json"
        dest: "{{ promptfoo_runtime_dir }}/package.json"
        mode: "0644"
      register: promptfoo_package_manifest

    - name: Copy Promptfoo runtime lockfile
      ansible.builtin.copy:
        src: "{{ chezmoi_source_dir }}/configs/promptfoo-runtime/package-lock.json"
        dest: "{{ promptfoo_runtime_dir }}/package-lock.json"
        mode: "0644"
      register: promptfoo_package_lock

    - name: Check Promptfoo runtime binary
      ansible.builtin.stat:
        path: "{{ promptfoo_runtime_dir }}/node_modules/.bin/promptfoo"
      register: promptfoo_runtime_binary

    - name: Install Promptfoo runtime from lockfile
      ansible.builtin.command:
        argv:
          - mise
          - exec
          - --
          - npm
          - ci
        chdir: "{{ promptfoo_runtime_dir }}"
      when: >-
        promptfoo_package_manifest is changed
        or promptfoo_package_lock is changed
        or not promptfoo_runtime_binary.stat.exists

    - name: Verify Promptfoo runtime and provider SDKs
      ansible.builtin.shell: |
        set -euo pipefail
        runtime_dir={{ promptfoo_runtime_dir | quote }}
        cd "$runtime_dir"
        mise exec -- node --input-type=module <<'NODE'
        for (const packageName of [
          'promptfoo',
          '@opencode-ai/sdk',
          '@anthropic-ai/claude-agent-sdk',
          '@anthropic-ai/sdk',
        ]) {
          import.meta.resolve(packageName);
        }
        NODE
        mise exec -- "$runtime_dir/node_modules/.bin/promptfoo" --version
      args:
        executable: /bin/bash
      changed_when: false

    - name: Read uv tools manifest
      ansible.builtin.slurp:
        src: "{{ chezmoi_source_dir }}/configs/uv_tools.txt"
      register: uv_tools_manifest

    - name: Parse uv tools manifest
      ansible.builtin.set_fact:
        uv_tools_desired: >-
          {{
            (uv_tools_manifest.content | b64decode).splitlines()
            | reject('match', '^\\s*(#|$)')
            | list
          }}

    - name: List installed uv tools
      ansible.builtin.shell: |
        set -euo pipefail
        mise exec -- uv tool list | grep -v '^-'
      args:
        executable: /bin/bash
      register: uv_tools_installed_raw
      changed_when: false
      failed_when: uv_tools_installed_raw.rc not in [0, 1]

    - name: Parse installed uv tools
      ansible.builtin.set_fact:
        uv_tools_installed: >-
          {{
            uv_tools_installed_raw.stdout_lines
            | map('regex_replace', '\\s+.*$', '')
            | reject('equalto', '')
            | list
          }}

    - name: Install uv tools
      ansible.builtin.command: mise exec -- uv tool install {{ item }} --force
      loop: "{{ uv_tools_desired }}"
      when: item not in uv_tools_installed

    - name: Read common npm globals manifest
      ansible.builtin.slurp:
        src: "{{ chezmoi_source_dir }}/configs/npm_globals.txt"
      register: npm_globals_common_manifest

    - name: Select WSL npm globals manifest
      ansible.builtin.set_fact:
        npm_globals_wsl_file: >-
          {{
            'npm_globals_linux_debian.txt'
            if (is_debian | bool)
            else 'npm_globals_linux.txt'
          }}

    - name: Read WSL npm globals manifest
      ansible.builtin.slurp:
        src: "{{ chezmoi_source_dir }}/configs/{{ npm_globals_wsl_file }}"
      register: npm_globals_wsl_manifest

    - name: Parse npm globals manifests
      ansible.builtin.set_fact:
        npm_globals_desired: >-
          {{
            (
              (npm_globals_common_manifest.content | b64decode).splitlines() +
              (npm_globals_wsl_manifest.content | b64decode).splitlines()
            )
            | map('trim')
            | reject('match', '^(#|$)')
            | unique
            | list
          }}

    - name: Install npm global packages
      ansible.builtin.command:
        argv:
          - mise
          - exec
          - --
          - npm
          - install
          - --global
          - "{{ item }}"
      loop: "{{ npm_globals_desired }}"

    - name: Read bun globals manifest
      ansible.builtin.slurp:
        src: "{{ chezmoi_source_dir }}/configs/bun_globals.txt"
      register: bun_globals_manifest

    - name: Parse bun globals manifest
      ansible.builtin.set_fact:
        bun_globals_desired: >-
          {{
            (bun_globals_manifest.content | b64decode).splitlines()
            | map('trim')
            | reject('match', '^(#|$)')
            | unique
            | list
          }}

    - name: Install bun global packages
      ansible.builtin.command:
        argv:
          - mise
          - exec
          - --
          - bun
          - add
          - --global
          - "{{ item }}"
      loop: "{{ bun_globals_desired }}"

    - name: Include ZSH and Antidote setup
      ansible.builtin.include_tasks: tasks/zsh-setup.yml

    - name: Include Debian dev tools
      ansible.builtin.include_tasks: tasks/debian-dev-tools.yml
      when: is_debian | bool

    - name: Check installed lazygit version
      ansible.builtin.command: "{{ local_bin }}/lazygit --version"
      register: lazygit_version_cmd
      changed_when: false
      failed_when: false

    - name: Parse installed lazygit version
      ansible.builtin.set_fact:
        lazygit_installed_version: >-
          {{
            (lazygit_version_cmd.stdout | default(''))
            | regex_search('[0-9]+\.[0-9]+\.[0-9]+')
            | default('')
          }}

    - name: Install or upgrade lazygit
      when:
        - (lazygit_version | default('')) | length > 0
        - (lazygit_installed_version | default('')) != lazygit_version
      block:
        - name: Download lazygit release archive
          ansible.builtin.unarchive:
            src: "https://github.com/jesseduffield/lazygit/releases/download/v{{ lazygit_version }}/lazygit_{{ lazygit_version }}_Linux_{{ lazygit_arch }}.tar.gz"
            dest: "{{ local_bin }}"
            remote_src: true
            include:
              - lazygit

        - name: Ensure lazygit binary permissions
          ansible.builtin.file:
            path: "{{ local_bin }}/lazygit"
            mode: "0755"

        - name: Verify installed lazygit version
          ansible.builtin.command: "{{ local_bin }}/lazygit --version"
          register: lazygit_verify_cmd
          changed_when: false

        - name: Parse verified lazygit version
          ansible.builtin.set_fact:
            lazygit_verified_version: >-
              {{
                (lazygit_verify_cmd.stdout | default(''))
                | regex_search('[0-9]+\.[0-9]+\.[0-9]+')
                | default('')
              }}

        - name: Assert lazygit version matches chezmoi data pin
          ansible.builtin.assert:
            that:
              - lazygit_verified_version == lazygit_version
            fail_msg: >-
              lazygit version mismatch after install
              (wanted {{ lazygit_version }}, got {{ lazygit_verified_version | default('unknown') }})

    - name: Check installed openusage version
      ansible.builtin.command: "{{ local_bin }}/openusage version"
      register: openusage_version_cmd
      changed_when: false
      failed_when: false

    - name: Parse installed openusage version
      ansible.builtin.set_fact:
        openusage_installed_version: >-
          {{
            (openusage_version_cmd.stdout | default(''))
            | regex_search('[0-9]+\.[0-9]+\.[0-9]+')
            | default('')
          }}

    - name: Install or upgrade openusage
      when: (openusage_installed_version | default('')) != versions.openusage
      block:
        - name: Download openusage release archive
          ansible.builtin.unarchive:
            src: "https://github.com/janekbaraniewski/openusage/releases/download/v{{ versions.openusage }}/openusage_{{ versions.openusage }}_linux_{{ deb_arch }}.tar.gz"
            dest: "{{ local_bin }}"
            remote_src: true
            include:
              - openusage

        - name: Ensure openusage binary permissions
          ansible.builtin.file:
            path: "{{ local_bin }}/openusage"
            mode: "0755"

    - name: Remove retired dotfiles-managed mnemo binary
      ansible.builtin.file:
        path: "{{ local_bin }}/mnemo"
        state: absent

    - name: Check installed dolt version
      ansible.builtin.command: "{{ local_bin }}/dolt version"
      register: dolt_version_cmd
      changed_when: false
      failed_when: false

    # `dolt version` prints a trailing "newest version is X" warning line when a
    # release is available, so match the leading CLI line rather than the first
    # version-shaped string anywhere in stdout (.opencode/journal.md 2026-05-16).
    - name: Parse installed dolt version
      ansible.builtin.set_fact:
        dolt_installed_version: >-
          {{
            (dolt_version_cmd.stdout | default(''))
            | regex_search('(?m)^dolt version\s+[0-9]+\.[0-9]+\.[0-9]+')
            | default('', true)
            | regex_search('[0-9]+\.[0-9]+\.[0-9]+')
            | default('', true)
          }}

    - name: Install or upgrade dolt
      when:
        - (dolt_version | default('')) | length > 0
        - (dolt_installed_version | default('')) != dolt_version
      block:
        - name: Create temporary directory for dolt archive extraction
          ansible.builtin.tempfile:
            state: directory
            suffix: dolt
          register: dolt_extract_dir

        - name: Download and extract dolt release archive
          ansible.builtin.unarchive:
            src: "https://github.com/dolthub/dolt/releases/download/v{{ dolt_version }}/dolt-linux-{{ deb_arch }}.tar.gz"
            dest: "{{ dolt_extract_dir.path }}"
            remote_src: true

        - name: Install dolt binary to local bin
          ansible.builtin.copy:
            src: "{{ dolt_extract_dir.path }}/dolt-linux-{{ deb_arch }}/bin/dolt"
            dest: "{{ local_bin }}/dolt"
            mode: "0755"
            remote_src: true

        - name: Verify installed dolt version
          ansible.builtin.command: "{{ local_bin }}/dolt version"
          register: dolt_verify_cmd
          changed_when: false

        - name: Parse verified dolt version
          ansible.builtin.set_fact:
            dolt_verified_version: >-
              {{
                (dolt_verify_cmd.stdout | default(''))
                | regex_search('(?m)^dolt version\s+[0-9]+\.[0-9]+\.[0-9]+')
                | default('', true)
                | regex_search('[0-9]+\.[0-9]+\.[0-9]+')
                | default('', true)
              }}

        - name: Assert dolt version matches chezmoi data pin
          ansible.builtin.assert:
            that:
              - dolt_verified_version == dolt_version
            fail_msg: >-
              dolt version mismatch after install
              (wanted {{ dolt_version }}, got {{ dolt_verified_version | default('unknown') }})

      always:
        - name: Remove temporary dolt extraction directory
          ansible.builtin.file:
            path: "{{ dolt_extract_dir.path | default('') }}"
            state: absent
          when: (dolt_extract_dir.path | default('')) | length > 0

    - name: Check installed aoe version
      ansible.builtin.command: "{{ local_bin }}/aoe --version"
      register: aoe_version_cmd
      changed_when: false
      failed_when: false

    - name: Parse installed aoe version
      ansible.builtin.set_fact:
        aoe_installed_version: >-
          {{
            (aoe_version_cmd.stdout | default(''))
            | regex_search('[0-9]+\.[0-9]+\.[0-9]+')
            | default('')
          }}

    - name: Install or upgrade aoe
      when: (aoe_installed_version | default('')) != versions.aoe
      block:
        - name: Create temporary directory for aoe archive extraction
          ansible.builtin.tempfile:
            state: directory
            suffix: aoe
          register: aoe_extract_dir

        - name: Download and extract aoe release archive
          ansible.builtin.unarchive:
            src: "https://github.com/agent-of-empires/agent-of-empires/releases/download/v{{ versions.aoe }}/aoe-linux-{{ deb_arch }}.tar.gz"
            dest: "{{ aoe_extract_dir.path }}"
            remote_src: true

        - name: Install aoe binary to local bin
          ansible.builtin.copy:
            src: "{{ aoe_extract_dir.path }}/aoe-linux-{{ deb_arch }}"
            dest: "{{ local_bin }}/aoe"
            mode: "0755"
            remote_src: true

      always:
        - name: Remove temporary aoe extraction directory
          ansible.builtin.file:
            path: "{{ aoe_extract_dir.path | default('') }}"
            state: absent
          when: (aoe_extract_dir.path | default('')) | length > 0

    - name: Check installed GitHub CLI version
      ansible.builtin.command: "{{ local_bin }}/gh --version"
      register: gh_version_cmd
      changed_when: false
      failed_when: false

    - name: Parse installed GitHub CLI version
      ansible.builtin.set_fact:
        gh_installed_version: >-
          {{
            (gh_version_cmd.stdout | default(''))
            | regex_search('[0-9]+\.[0-9]+\.[0-9]+')
            | default('')
          }}

    - name: Install or upgrade GitHub CLI
      when: (gh_installed_version | default('')) != versions.gh
      block:
        - name: Create temporary directory for GitHub CLI extraction
          ansible.builtin.tempfile:
            state: directory
            suffix: gh
          register: gh_extract_dir

        - name: Download and extract GitHub CLI release archive
          ansible.builtin.unarchive:
            src: "https://github.com/cli/cli/releases/download/v{{ versions.gh }}/gh_{{ versions.gh }}_linux_{{ deb_arch }}.tar.gz"
            dest: "{{ gh_extract_dir.path }}"
            remote_src: true

        - name: Install GitHub CLI binary to local bin
          ansible.builtin.copy:
            src: "{{ gh_extract_dir.path }}/gh_{{ versions.gh }}_linux_{{ deb_arch }}/bin/gh"
            dest: "{{ local_bin }}/gh"
            mode: "0755"
            remote_src: true

        - name: Verify installed GitHub CLI version
          ansible.builtin.command: "{{ local_bin }}/gh --version"
          register: gh_verify_cmd
          changed_when: false

        - name: Parse verified GitHub CLI version
          ansible.builtin.set_fact:
            gh_verified_version: >-
              {{
                (gh_verify_cmd.stdout | default(''))
                | regex_search('[0-9]+\.[0-9]+\.[0-9]+')
                | default('')
              }}

        - name: Assert GitHub CLI version matches package pin
          ansible.builtin.assert:
            that:
              - gh_verified_version == versions.gh
            fail_msg: >-
              GitHub CLI version mismatch after install
              (wanted {{ versions.gh }}, got {{ gh_verified_version | default('unknown') }})

      always:
        - name: Remove temporary GitHub CLI extraction directory
          ansible.builtin.file:
            path: "{{ gh_extract_dir.path | default('') }}"
            state: absent
          when: (gh_extract_dir.path | default('')) | length > 0

    - name: Check installed GitLab CLI version
      ansible.builtin.command: "{{ local_bin }}/glab version"
      register: glab_version_cmd
      changed_when: false
      failed_when: false

    - name: Parse installed GitLab CLI version
      ansible.builtin.set_fact:
        glab_installed_version: >-
          {{
            (glab_version_cmd.stdout | default(''))
            | regex_search('[0-9]+\.[0-9]+\.[0-9]+')
            | default('')
          }}

    - name: Install or upgrade GitLab CLI
      when: (glab_installed_version | default('')) != versions.glab
      block:
        - name: Create temporary directory for GitLab CLI extraction
          ansible.builtin.tempfile:
            state: directory
            suffix: glab
          register: glab_extract_dir

        - name: Download and extract GitLab CLI release archive
          ansible.builtin.unarchive:
            src: "https://gitlab.com/gitlab-org/cli/-/releases/v{{ versions.glab }}/downloads/glab_{{ versions.glab }}_linux_{{ deb_arch }}.tar.gz"
            dest: "{{ glab_extract_dir.path }}"
            remote_src: true

        - name: Install GitLab CLI binary to local bin
          ansible.builtin.copy:
            src: "{{ glab_extract_dir.path }}/bin/glab"
            dest: "{{ local_bin }}/glab"
            mode: "0755"
            remote_src: true

        - name: Verify installed GitLab CLI version
          ansible.builtin.command: "{{ local_bin }}/glab version"
          register: glab_verify_cmd
          changed_when: false

        - name: Parse verified GitLab CLI version
          ansible.builtin.set_fact:
            glab_verified_version: >-
              {{
                (glab_verify_cmd.stdout | default(''))
                | regex_search('[0-9]+\.[0-9]+\.[0-9]+')
                | default('')
              }}

        - name: Assert GitLab CLI version matches package pin
          ansible.builtin.assert:
            that:
              - glab_verified_version == versions.glab
            fail_msg: >-
              GitLab CLI version mismatch after install
              (wanted {{ versions.glab }}, got {{ glab_verified_version | default('unknown') }})

      always:
        - name: Remove temporary GitLab CLI extraction directory
          ansible.builtin.file:
            path: "{{ glab_extract_dir.path | default('') }}"
            state: absent
          when: (glab_extract_dir.path | default('')) | length > 0

    - name: Check installed plannotator version
      ansible.builtin.command: "{{ local_bin }}/plannotator --version"
      register: plannotator_version_cmd
      changed_when: false
      failed_when: false

    - name: Parse installed plannotator version
      ansible.builtin.set_fact:
        plannotator_installed_version: >-
          {{
            (plannotator_version_cmd.stdout | default(''))
            | regex_search('[0-9]+\.[0-9]+\.[0-9]+')
            | default('')
          }}

    - name: Install or upgrade plannotator
      when:
        - plannotator_version | length > 0
        - (plannotator_installed_version | default('')) != plannotator_version
      block:
        - name: Create temporary directory for plannotator download
          ansible.builtin.tempfile:
            state: directory
            suffix: plannotator
          register: plannotator_tmp_dir

        - name: Fetch plannotator SHA256 sidecar
          ansible.builtin.get_url:
            url: "https://github.com/backnotprop/plannotator/releases/download/v{{ plannotator_version }}/plannotator-linux-{{ plannotator_arch }}.sha256"
            dest: "{{ plannotator_tmp_dir.path }}/plannotator-linux-{{ plannotator_arch }}.sha256"
            mode: "0644"

        - name: Read expected SHA256
          ansible.builtin.slurp:
            src: "{{ plannotator_tmp_dir.path }}/plannotator-linux-{{ plannotator_arch }}.sha256"
          register: plannotator_sha_blob

        - name: Parse expected SHA256
          ansible.builtin.set_fact:
            plannotator_expected_sha: "{{ (plannotator_sha_blob.content | b64decode).split() | first }}"

        - name: Download plannotator binary (sha256-verified)
          ansible.builtin.get_url:
            url: "https://github.com/backnotprop/plannotator/releases/download/v{{ plannotator_version }}/plannotator-linux-{{ plannotator_arch }}"
            dest: "{{ plannotator_tmp_dir.path }}/plannotator"
            checksum: "sha256:{{ plannotator_expected_sha }}"
            mode: "0755"

        - name: Install plannotator binary to local bin
          ansible.builtin.copy:
            src: "{{ plannotator_tmp_dir.path }}/plannotator"
            dest: "{{ local_bin }}/plannotator"
            mode: "0755"
            remote_src: true

      always:
        - name: Remove temporary plannotator directory
          ansible.builtin.file:
            path: "{{ plannotator_tmp_dir.path | default('') }}"
            state: absent
          when: (plannotator_tmp_dir.path | default('')) | length > 0

    - name: Include Ubuntu extras
      ansible.builtin.include_tasks: tasks/ubuntu-extras.yml
      when: is_ubuntu | bool

    - name: Include system configuration
      ansible.builtin.include_tasks: tasks/system-config.yml

    - name: Include certificates
      ansible.builtin.include_tasks: tasks/certificates.yml
      when:
        - cert_path | length > 0
        - cert_files | length > 0

    - name: Include 1Password setup
      ansible.builtin.include_tasks: tasks/onepassword-setup.yml
      when: op_url | length > 0

  post_tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "WSL2 provisioning complete!"
          - "Restart your terminal or run: exec zsh"
          - "NOTE: Run 'cz apply' again to finalize shell config (some .zshrc sections are generated based on which tools exist at apply time)."
          - "You may need to restart WSL for some changes to take effect."
