[defaults]
# ansible-core 2.24 will stop auto-injecting facts as top-level vars unless
# explicitly enabled. This repo currently relies on vars like ansible_env and
# ansible_architecture being available.
inject_facts_as_vars = True

# 2026-01-01: Disable deprecation warnings because these are emitted by upstream
# collection/module internals (e.g. ansible.posix.mount) and fixing would
# require patching vendored Python module code. Keep provisioning output clean.
deprecation_warnings = False
