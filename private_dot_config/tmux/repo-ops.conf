set -g default-terminal 'tmux-256color'
set -g window-size latest
set -g aggressive-resize on
set -g allow-rename off
set -g set-titles off
set -g mouse on
set -g status-style 'fg=colour231,bg=colour235'
set -g status-left-style 'fg=colour16,bg=colour81,bold'
set -g status-right-style 'fg=colour252,bg=colour235'
set -g window-status-current-style 'fg=colour16,bg=colour221,bold'
set -g window-status-style 'fg=colour250,bg=colour235'
set -g pane-border-style 'fg=colour242'
set -g pane-active-border-style 'fg=colour81'
set -g message-style 'fg=colour231,bg=colour24,bold'
set -g mode-style 'fg=colour16,bg=colour221'
set -g remain-on-exit on
bind-key -T prefix G run-shell 'repo-ops focus #{pane_id}'
