set -g default-terminal 'tmux-256color'
set -g window-size latest
set -g aggressive-resize on
set -g allow-rename off
set -g automatic-rename off
set -g set-titles on
set -g set-titles-string 'repo-ops: #{window_name}#{?#{m/r:^-?(zsh|bash|fish|sh|dash|ksh|pwsh)$,#{pane_current_command}},, | #{pane_current_command}}'
set -g mouse on
set -g status-style 'fg=colour223,bg=colour235'
set -g status-justify absolute-centre
set -g status-left-length 64
set -g status-right-length 32
set -g status-left '#[fg=colour223,bg=colour239,bold] #S #[default] '
set -g status-right '#[fg=colour248,bg=colour239] %H:%M  %d-%b-%y #[default]'
set -g window-status-separator ' '
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W#{?window_zoomed_flag,*,} '
set -g window-status-current-style 'fg=colour235,bg=colour214,bold'
set -g window-status-style 'fg=colour223,bg=colour237'
set -g pane-border-style 'fg=colour239'
set -g pane-active-border-style 'fg=colour106'
set -g message-style 'fg=colour223,bg=colour239,bold'
set -g mode-style 'fg=colour235,bg=colour214'
set -g remain-on-exit on
bind-key -T prefix G run-shell 'repo-ops focus #{pane_id}'
