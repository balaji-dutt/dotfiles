# Forward the pane title out to the enclosing terminal.
#
# Without this, iTerm2 names an AoE tab after the deepest foreground job on its
# tty, which is the tmux client, so every AoE tab reads "tmux". The agent title
# emitted by ~/.local/share/zsh/55-terminal-title.zsh lands in tmux's
# pane_title; forwarding it lets the outer tab name the agent instead.
#
# AoE starts tmux without -f and exports XDG_CONFIG_HOME, so this file is the
# config its server reads. It sets set-clipboard and allow-passthrough
# per-session at creation time, so nothing here affects OSC52 copy.
#
# See docs/tooling/iterm-titles.md.

set -g set-titles on
set -g set-titles-string '#{pane_title}'
